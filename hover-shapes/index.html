<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 170px;
            height: 170px;
            color: transparent;
            box-shadow: 10px 10px 24px var(--glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .cube::after{
            content: "hover";
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px var(--glow);
            color: #fff;
        }
        .cube:hover::after{
            opacity: 1;
        }
        .c1{
            --glow: rgba(255, 94, 98, .35);
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
        }
        .c2{
            --glow: rgba(55, 209, 150, .35);
            border-radius: 22%;
            background: linear-gradient(135deg,#42e695,#2bb673);
        }
        .c3{
            --glow: rgba(141, 117, 157, .38);
            border-radius: 38%;
            background: linear-gradient(135deg,#aa8bd0,#6f5a8b);
        }
        .c4{
            --glow: rgba(249, 193, 112, .4);
            border-radius: 50%;
            background: linear-gradient(135deg,#ffe080,#f39b70);
        }
        .c5{
            --glow: rgba(75, 116, 116, .42);
            border-radius: 14px;
            background: linear-gradient(135deg,#5c9b85,#426878);
        }
        .c6{
            --glow: rgba(179, 143, 181, .42);
            border-radius: 50%;
            background: linear-gradient(135deg,#c69fc7,#986f9e);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
