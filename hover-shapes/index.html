<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Shapes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-color: #171923;
        }

        .stage {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 3vw, 56px);
            padding: clamp(40px, 5vw, 56px) 32px;
        }

        .cube {
            --shadow-x: 10px;
            --shadow-y: 10px;
            --glow: rgba(255, 255, 255, 0.28);

            position: relative;
            display: grid;
            place-items: center;
            width: clamp(102px, 12vw, 170px);
            height: clamp(102px, 12vw, 170px);
            color: #fff;
            font: 600 20px/1 Arial, sans-serif;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            box-shadow: var(--shadow-x) var(--shadow-y) 28px var(--glow);
            transition:
                transform 0.32s ease,
                box-shadow 0.32s ease;
        }

        .cube::after {
            content: "hover";
            opacity: 0;
            transform: translateY(8px);
            transition:
                opacity 0.24s ease,
                transform 0.32s ease;
        }

        .cube:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 28px var(--glow);
        }

        .cube:hover::after {
            opacity: 1;
            transform: translateY(0);
        }

        /* 1. 橙红色正方形 */
        .c1 {
            --glow: rgba(255, 94, 98, 0.38);
            background: linear-gradient(135deg, #ff9a56, #ff5e62);
        }

        /* 2. 薄荷绿小圆角方形 */
        .c2 {
            --glow: rgba(48, 209, 148, 0.38);
            border-radius: 22%;
            background: linear-gradient(135deg, #42e695, #2bb673);
        }

        /* 3. 紫色大圆角方形 */
        .c3 {
            --glow: rgba(141, 117, 157, 0.42);
            border-radius: 38%;
            background: linear-gradient(135deg, #aa8bd0, #6f5a8b);
        }

        /* 4. 橙黄色圆形 */
        .c4 {
            --glow: rgba(249, 193, 112, 0.42);
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe080, #f39b70);
        }

        /* 5. 灰绿色小圆角方形 */
        .c5 {
            --glow: rgba(75, 116, 116, 0.46);
            border-radius: 14px;
            background: linear-gradient(135deg, #5c9b85, #426878);
        }

        /* 6. 雾紫色圆形 */
        .c6 {
            --glow: rgba(179, 143, 181, 0.46);
            border-radius: 50%;
            background: linear-gradient(135deg, #c69fc7, #986f9e);
        }
    </style>
</head>
<body>
    <main class="stage" aria-label="可交互图形展示">
        <div class="cube c1" tabindex="0"></div>
        <div class="cube c2" tabindex="0"></div>
        <div class="cube c3" tabindex="0"></div>
        <div class="cube c4" tabindex="0"></div>
        <div class="cube c5" tabindex="0"></div>
        <div class="cube c6" tabindex="0"></div>
    </main>
</body>
</html>
